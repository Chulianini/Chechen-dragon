<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chechens & Dragons - Portal del Reino</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4e4bc; font-family: 'MedievalSharp', cursive; color: #2c1b0e; margin: 0; padding: 20px; background-image: url('https://www.transparenttextures.com/patterns/parchment.png'); }
        .container { max-width: 800px; margin: auto; border: 10px double #8b4513; padding: 20px; background: rgba(255,255,255,0.3); box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        h1 { text-align: center; border-bottom: 2px solid #8b4513; padding-bottom: 10px; }
        .login-box { text-align: center; padding: 50px; }
        input { padding: 10px; font-size: 1.2rem; border: 2px solid #8b4513; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 1.2rem; background: #8b4513; color: white; border: none; cursor: pointer; }
        .tabs { display: none; }
        .tab-buttons { display: flex; overflow-x: auto; gap: 5px; margin-bottom: 20px; }
        .tab-btn { background: #d2b48c; border: 1px solid #8b4513; padding: 10px; cursor: pointer; flex-shrink: 0; }
        .tab-btn.active { background: #8b4513; color: white; }
        .content-section { display: none; background: white; padding: 15px; border-radius: 5px; border: 1px solid #8b4513; }
        .content-section.active { display: block; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #fffaf0; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="login-section" class="login-box">
        <h1>Chechens & Dragons</h1>
        <p>Introduce la clave de tu Reino:</p>
        <input type="password" id="passkey" placeholder="Palabra de paso...">
        <button onclick="checkLogin()">Entrar</button>
    </div>

    <div id="dashboard" class="tabs">
        <h1 id="reino-nombre">Cargando...</h1>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="openTab('resumen')">Resumen</button>
            <button class="tab-btn" onclick="openTab('economia')">Economía</button>
            <button class="tab-btn" onclick="openTab('militar')">Militar</button>
            <button class="tab-btn" onclick="openTab('espionaje')">Espionaje</button>
        </div>

        <div id="resumen" class="content-section active">
            <h3>Estado del Soberano</h3>
            <p id="noticias" style="font-style: italic; color: #5d4037;"></p>
            <div class="stat-grid">
                <div class="stat-card"><strong>Soberano:</strong> <span id="soberano"></span></div>
                <div class="stat-card"><strong>Fama:</strong> <span id="fama"></span> PF</div>
            </div>
        </div>

        <div id="economia" class="content-section">
            <h3>Tesorería Real</h3>
            <div class="stat-grid">
                <div class="stat-card">💰 Oro: <span id="oro"></span></div>
                <div class="stat-card">🌾 Comida: <span id="comida"></span></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Estos son los datos de los reinos. ¡Aquí es donde tú editas!
    const baseDatos = {
        "gorrinos2026": {
            nombre: "Clan Gorrinos",
            soberano: "Er Mazte Melacome Senior",
            oro: 1800,
            comida: 343,
            fama: 15,
            noticias: "Tus espías 'Er Quillo' y 'OOZiete' han subido de nivel. La empalizada aguanta."
        },
        "dragon2026": {
            nombre: "Reino Dragón",
            soberano: "Lord Ignis",
            oro: 1200,
            comida: 500,
            fama: 10,
            noticias: "Sequía en los valles del sur."
        }
    };

    function checkLogin() {
        const pass = document.getElementById('passkey').value;
        if (baseDatos[pass]) {
            cargarDatos(baseDatos[pass]);
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        } else {
            alert("Clave incorrecta, intruso.");
        }
    }

    function cargarDatos(data) {
        document.getElementById('reino-nombre').innerText = data.nombre;
        document.getElementById('soberano').innerText = data.soberano;
        document.getElementById('oro').innerText = data.oro;
        document.getElementById('comida').innerText = data.comida;
        document.getElementById('fama').innerText = data.fama;
        document.getElementById('noticias').innerText = data.noticias;
    }

    function openTab(tabId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
